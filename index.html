<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link type="text/css" href="Javascript/estilo.css" rel="stylesheet">
</head>
<body onload="init();">
    <table class="calculadora has-background-current">
        <tr>
            <td colspan="4">
                <span id="resultado"></span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="potencia" class="button is-warning is-dark">x²</button>
            </td>
            <td>
                <button id="raiz" class="button is-warning is-dark">√</button>
            </td>
            <td>
                <button id="logaritmo" class="button is-warning is-dark">log</button>
            </td>
            <td>
                <button id="porcentaje" class="button is-warning is-dark">%</button>
            </td>
        </tr>
        <tr>
            <td>
                <button id="siete" class="button is-primary is-dark">7</button>
            </td>
            <td>
                <button id="ocho" class="button is-primary is-dark">8</button>
            </td>
            <td>
                <button id="nueve" class="button is-primary is-dark">9</button>
            </td>
            <td>
                <button id="division" class="button is-danger is-dark">/</button>
            </td>
        </tr>
        <tr>
            <td>
                <button id="cuatro" class="button is-primary is-dark">4</button>
            </td>
            <td>
                <button id="cinco" class="button is-primary is-dark">5</button>
            </td>
            <td>
                <button id="seis" class="button is-primary is-dark">6</button>
            </td>
            <td>
                <button id="multiplicacion" class="button is-danger is-dark">*</button>
            </td>
        </tr>
        <tr>
            <td>
                <button id="uno" class="button is-primary is-dark">1</button>
            </td>
            <td>
                <button id="dos" class="button is-primary is-dark">2</button>
            </td>
            <td>
                <button id="tres" class="button is-primary is-dark">3</button>
            </td>

            <td>
                <button id="resta" class="button is-danger is-dark">-</button>
            </td>
        </tr>
        <tr>
            <td>
                <button id="igual" class="button is-success is-dark">=</button>
            </td>

            <td>
                <button id="reset" class="button is-danger is-dark">C</button>
            </td>

            <td>
                <button id="cero" class="button is-primary is-dark">0</button>
            </td>

            <td>
                <button id="suma" class="button is-danger is-dark">+</button>
            </td>
        </tr>
        <tr>
            <td colspan="4">
                <button id="fraccion" class="button is-info is-dark">
                    / Fracción
                </button>
            </td>
        </tr>
    </table>
    <script src="js/js.js"></script>
</body>
</html>
